<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .container{
            width:350px;
            margin:100px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input,button{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            background:green;
            color:white;
            border:none;
            cursor:pointer;
        }

        h2{
            text-align:center;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Login</h2>

<form id="loginForm">

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<p id="message"></p>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit",async function(e){

e.preventDefault();

const form=new FormData(this);

const response=await fetch("/login",{

method:"POST",

headers:{
"Content-Type":"application/x-www-form-urlencoded"
},

body:new URLSearchParams({

username:form.get("email"),
password:form.get("password")

})

});

const result=await response.json();

if(response.ok){

localStorage.setItem(
"access_token",
result.access_token
);

window.location.href="/dashboard";

}else{

document.getElementById("message").innerHTML=result.detail;

}

});

</script>

</body>
</html>
